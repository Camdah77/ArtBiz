{% extends 'base.html' %}

{% block content %}

<div class="hero-image" style="background-image: url('https://res.cloudinary.com/dj9sie6nl/image/upload/v1794058814/hero_artbiz_bob7uy.png');"></div>



<!-- Vi ser till att containern har rätt padding i toppen under navbaren -->
<div class="container" style="padding-top: 80px; margin-bottom: 60px;">
    
    <!-- Ändrad rad: Helt vänsterjusterad text (text-start) -->
    <div class="row mb-4">
        <div class="col-12 text-start">
            <h1 class="display-6 fw-bold" style="color: #b59780; margin-bottom: 5px;">Your walls</h1>
            <p class="lead text-muted small">Let the office become an inspiring meeting place for employees and clients</p>
            <!-- Vi gör det lilla dekorationsstrecket vänsterjusterat och snyggt -->
            <hr class="border-secondary opacity-25" style="width: 100px; margin: 15px 0 0 0;">
        </div>
    </div>
    {% endblock %}
