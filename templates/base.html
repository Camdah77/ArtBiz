{% load static %}
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ArtBiz connects artists and businesses.">
    <meta name="keywords" content="ArtBiz, art, business, artists, events, services">
   
    <title>ArtBiz - Connects art and business</title>  
    <link rel="icon" type="image/jpeg" href="{% static 'images/favicon_artbiz.jpg' %}">

    <!-- Bootstrap CSS  -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<!-- d-flex flex-column min-vh-100 to keep footer at the bottom -->
<body class="d-flex flex-column min-vh-100">
    <header>
        <!-- Bootstrap (Navbar) = fixed top -->   
        <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
            <div class="container">
               <a class="navbar-brand" href="{% url 'home' %}">
                 <img src="{% static 'images/ArtBizLogo.png' %}" alt="ArtBiz Logo" style="height: 80px;">
                </a>
                     <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item"><a class="nav-link" href="{% url 'services' %}">Our Service</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'events' %}">Events</a></li>
                        <li class="nav-item"><a class="nav-link" href="{% url 'artist_list' %}">Artists</a></li>
                        {% if user.is_authenticated %}
                            <li class="nav-item"><a class="nav-link" href="{% url 'account_logout' %}">Log out</a></li>
                        {% else %}
                            <li class="nav-item"><a class="nav-link" href="{% url 'account_login' %}">Log in</a></li>
                            <li class="nav-item"><a class="nav-link" href="{% url 'account_signup' %}">Sign Up</a></li>
                        {% endif %}
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- flex-grow-1 push footer to the bottom -->
    <main class="flex-grow-1">
        {% block content %}
        {% endblock %}
    </main>
   
    <!-- Footer -->
    <footer class="footer bg-dark text-white text-center py-4 w-100">
        <div class="container">
            <p class="mb-0">Made by Camilla Dahlström | Student project at <a href="https://codeinstitute.net/se/" target="_blank" rel="noopener" aria-label="Visit Code Institute" class="text-white fw-bold">Code Institute</a></p>
        </div>
    </footer>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
