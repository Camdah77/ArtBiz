{% load static %} 
{% load django_bootstrap5 %}
{% bootstrap_css %}
{% bootstrap_javascript %}

 
<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ArtBiz connects artists and businesses.">
    <meta name="keywords" content="ArtBiz, art, business, artists, events, services">
   
    <title>ArtBiz - Connects art and business</title>  
    <link rel="icon" type="image/jpeg" href="{% static 'images/favicon_artbiz.jpg' %}">

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!-- Bootstrap (Navbar) med fixed-top istället för trasig CSS -->   
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
        <div class="container">
             <img src="{% static 'images/ArtBizLogo.png' %}" alt="ArtBiz Logo" class="navbar-brand" style="height: 80px;">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Our Service</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Events</a></li>
                    <!-- Ändrad till korrekt Django-länk -->
                    <li class="nav-item"><a class="nav-link" href="{% url 'artist_list' %}">Artists</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Log in</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Vi tar bort den fasta containern härifrån så att home.html kan sträcka ut sig till 100% bredd -->
    {% block content %}
    {% endblock %}

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
