{% load static %}

<!DOCTYPE html>
<html lang="sv">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="ArtBiz connects artists and businesses.">
    <meta name="keywords"
        content="ArtBiz, art, business, artists, events, services">

    
        
    <!-- site title and favicon -->    
    <title>ArtBiz - Connects art and business</title>  
    <link rel="icon" type="image/jpeg" href="{% static 'images/favicon_artbiz.jpg' %}">

    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <!--  Bootstrap  (Navbar) -->   
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark position:fixed">
        <div class="container">
             <img src="{% static 'images/ArtBizLogo.png' %}" alt="ArtBiz Logo" class="navbar-brand" style="height: 80px;">
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-expand-lg navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="#">Our Service</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Events</a></li>
                    <li class="nav-item"><a class="nav-link" href="artists\templates\artist_list.html">Artists</a></li>
                    <li class="nav-item"><a class="nav-link" href="#">Log in</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Other Apps -->
    <div class="container my-5">
        {% block content %}
        {% endblock %}
    </div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
