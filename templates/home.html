{% extends 'base.html' %}
{% load static %}

{% block content %}
<!-- HeroImage Cover screen -->
<div class="hero-image" style="background-image: url('https://res.cloudinary.com/dj9sie6nl/image/upload/v1794058814/hero_artbiz_bob7uy.png');"></div>



<!-- Vi ser till att containern har rätt padding i toppen under navbaren -->
<div class="container" style="padding-top: 80px; margin-bottom: 60px;">
    
    <!-- Ändrad rad: Helt vänsterjusterad text (text-start) -->
    <div class="row mb-4">
        <div class="col-12 text-start">
            <h1 class="display-6 fw-bold" style="color: #b59780; margin-bottom: 5px;">Your walls</h1>
            <p class="lead text-muted small">Our business</p>
            <!-- Vi gör det lilla dekorationsstrecket vänsterjusterat och snyggt -->
            <hr class="border-secondary opacity-25" style="width: 100px; margin: 15px 0 0 0;">
        </div>
    </div>

<div class="row g-4">
    
    <!-- Kort 1 -->
    <div class="col-md-6">
        <div class="card border-0"> <!-- border-0 tar bort Bootstraps standard-ram -->
            <div class="card-body" style="background-color: #212529;">1</div>
        </div>
    </div>
    
    <!-- Kort 2 -->
    <div class="col-md-6">
        <div class="card border-0">
            <div class="card-body" style="background-color: #b59780;">2</div>
        </div>
    </div>

    <!-- Kort 3 -->
    <div class="col-md-6">
        <div class="card border-0">
            <div class="card-body" style="background-color:  #b59780;">3</div>
        </div>
    </div>
    
    <!-- Kort 4 -->
    <div class="col-md-6">
        <div class="card border-0">
            <div class="card-body" style="background-color: #212529">4</div>
        </div>
    </div>

</div>




<!-- Resten av ditt supersnygga schackmönster -->
<div class="container-fluid px-0 mx-0">
    
    <!-- Rad 2: Your Walls & Tom ruta -->
    <div class="row g-0 align-items-center text-center">
        <div class="col-md-6 d-flex align-items-center justify-content-center text-white fw-bold" style="background-color: #b59780; height: 300px; font-size: 1.5rem; letter-spacing: 2px;">
            YOUR WALLS OUR BUSINESS
        </div>
        <div class="col-md-6" style="background-color: #4a4a4a; height: 300px;"></div>
    </div>

    <!-- Rad 3: Tom ruta & Our Artists -->
    <div class="row g-0 align-items-center text-center">
        <div class="col-md-6" style="background-color: #4a4a4a; height: 300px;"></div>
        <a href="{% url 'artist_list' %}" class="col-md-6 d-flex align-items-center justify-content-center text-white fw-bold text-decoration-none highlight-hover" style="background-color: #c2a38e; height: 300px; font-size: 1.5rem; letter-spacing: 2px;">
            OUR ARTISTS
        </a>
    </div>

    <!-- Rad 4: Booking & Tom ruta -->
    <div class="row g-0 align-items-center text-center">
        <div class="col-md-6 d-flex align-items-center justify-content-center text-white fw-bold" style="background-color: #b59780; height: 300px; font-size: 1.5rem; letter-spacing: 2px;">
            BOOKING
        </div>
        <div class="col-md-6" style="background-color: #4a4a4a; height: 300px;"></div>
    </div>

</div>
{% endblock %}
