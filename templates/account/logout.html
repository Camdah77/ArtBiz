{% extends "base.html" %}

{% block content %}
<!-- Full-screen background container -->
<div class="auth-bg w-100" style="background-image: url('https://res.cloudinary.com/dj9sie6nl/image/upload/v1794058814/hero_artbiz_bob7uy.png');">
    <div class="container pt-5">
        <div class="row justify-content-center align-items-center auth-row">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 p-4 my-4">
                    <h1 class="h2 text-start mb-4 fw-bold page-title">Sign Out</h1>
                    <p class="text-muted mb-4">Hope to see you again soon!</p>

                    <form method="POST" action="{% url 'account_logout' %}">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-artbiz">Sign Out</button>
                            <a href="{% url 'home' %}" class="btn btn-outline-secondary">Cancel</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
