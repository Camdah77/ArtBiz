{% extends "base.html" %}

{% block content %}
<!-- Full-screen background container -->
<div class="auth-bg w-100" style="background-image: url('https://res.cloudinary.com/dj9sie6nl/image/upload/v1794155254/hero_2office_sman1x.jpg');">
    <div class="container pt-5">
        <div class="row justify-content-center align-items-center auth-row">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-lg border-0 p-4 my-4">
                    <h1 class="h2 text-start mb-4 fw-bold page-title">Sign Up</h1>

                    <form method="POST" action="{% url 'account_signup' %}">
                        {% csrf_token %}

                        <div class="mb-3">
                            {{ form.as_p }}
                        </div>

                        <div class="d-grid gap-2 mt-4">
                            <button type="submit" class="btn btn-artbiz">Register</button>
                        </div>
                    </form>

                    <div class="text-center mt-4 border-top pt-3">
                        <p class="text-muted mb-0">
                            Already a member of the ArtBiz family?
                            <a href="{% url 'account_login' %}" class="link-dark fw-bold text-decoration-none">Sign In</a>
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
