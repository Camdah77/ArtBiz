{% extends "base.html" %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card shadow-sm border-danger p-4">
                <h1 class="display-6 fw-bold page-title">Delete Account</h1>
                <p>Are you sure you want to delete your account? This will permanently remove your profile and all your linked bookings. This action cannot be undone.</p>
                
                <form method="POST" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-danger">Yes, delete my account</button>
                        <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
