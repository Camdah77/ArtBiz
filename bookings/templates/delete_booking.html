{% extends 'base.html' %}

{% block content %}
<div class="container my-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-sm border-0 rounded-3">
                <div class="card-body p-4 p-md-5 text-center">
                   <h1 class="display-6 fw-bold" style="color: #b59780; margin-bottom: 20px; padding-top: 40px">Cancel Booking</h1>
                    <p class="text-muted mb-4">
                        Are you sure you want to cancel your booking for <strong>{{ booking.service.title }}</strong> on <strong>{{ booking.booking_date|date:"Y-m-d H:i" }}</strong>?
                    </p>
                    <p class="small text-danger mb-4">This action cannot be undone.</p>

                    <form method="POST">
                        {% csrf_token %}
                        <div class="d-grid gap-2">
                            <button type="submit" class="btn btn-danger fw-bold">Yes, Cancel Booking</button>
                            <a href="{% url 'dashboard' %}" class="btn btn-outline-secondary">No, Keep Booking</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
